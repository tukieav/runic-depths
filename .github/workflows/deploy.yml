name: Verify & Deploy Runic Depths
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: graphics
            command: node tests/graphics-assets.mjs
            evidence: qa/graphics
          - suite: cinematic
            command: node tests/cinematic-browser.mjs
            evidence: qa/cinematic
          - suite: enemies
            command: node tests/enemy-browser.mjs
            evidence: qa/enemies
          - suite: gameplay
            command: node tests/arpg-browser.mjs
            evidence: qa/arpg
          - suite: platform-audio
            command: node tests/platform-browser.mjs && node tests/audio-browser.mjs
            evidence: qa/arpg/platform-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test ${{ matrix.suite }}
        run: |
          export CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.suite }}
          path: ${{ matrix.evidence }}
  build-deploy:
    needs: browser-checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:campaign
      - run: npm run build
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runic-depths-package
          path: releases
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
