name: Verify & Deploy Runic Depths
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:campaign
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test gameplay, touch, platform lifecycle and audio
        run: |
          export CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          node tests/arpg-browser.mjs
          node tests/platform-browser.mjs
          node tests/audio-browser.mjs
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runic-depths-qa-and-package
          path: |
            qa/arpg
            releases
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
