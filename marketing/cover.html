<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;background:#000}</style></head>
<body>
<canvas id="cover"></canvas>
<script>
// Runic Depths cover: real gameplay screenshot as backdrop + atmospheric title.
// ?w=&h=&sq=1
const q = new URLSearchParams(location.search);
const W = parseInt(q.get('w') || '1920', 10);
const H = parseInt(q.get('h') || '1080', 10);
const sq = q.get('sq') === '1';
const canvas = document.getElementById('cover');
canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d');

function torch(x, y, s) {
  const grd = g.createRadialGradient(x, y, 0, x, y, 120 * s);
  grd.addColorStop(0, 'rgba(255,190,90,0.55)');
  grd.addColorStop(0.4, 'rgba(255,140,40,0.25)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(x, y, 120 * s, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3a2a1a'; g.fillRect(x - 3 * s, y, 6 * s, 26 * s);
  g.fillStyle = '#ffb347';
  g.beginPath(); g.ellipse(x, y - 6 * s, 7 * s, 12 * s, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffe08a';
  g.beginPath(); g.ellipse(x, y - 4 * s, 4 * s, 7 * s, 0, 0, Math.PI * 2); g.fill();
}

async function main() {
  const S = H / 1080;
  // Text-free, bespoke dungeon tableau: marketing covers never inherit UI or
  // screenshot text, and title treatment remains the only typography.
  g.fillStyle = '#090817'; g.fillRect(0, 0, W, H);
  const tile = Math.max(32, Math.round(52 * S));
  for (let y = 0; y < H; y += tile) for (let x = 0; x < W; x += tile) {
    const n = (Math.sin(x * 0.031 + y * 0.047) + 1) * 0.5;
    g.fillStyle = `rgb(${31 + n * 12 | 0},${28 + n * 10 | 0},${47 + n * 15 | 0})`;
    g.fillRect(x + 1, y + 1, tile - 2, tile - 2);
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x, y + tile - 3, tile, 3);
  }
  // framed central passage, distant rune gate, and a tiny hero silhouette.
  const cx = W / 2, gateY = H * 0.62, gateR = Math.min(W, H) * 0.18;
  g.fillStyle = '#161226'; g.fillRect(cx - W * 0.20, H * 0.18, W * 0.40, H * 0.70);
  g.strokeStyle = '#514862'; g.lineWidth = Math.max(5, 9 * S);
  g.strokeRect(cx - W * 0.20, H * 0.18, W * 0.40, H * 0.70);
  const runeGlow = g.createRadialGradient(cx, gateY, 5, cx, gateY, gateR * 1.35);
  runeGlow.addColorStop(0, 'rgba(106,208,255,0.45)'); runeGlow.addColorStop(1, 'rgba(50,90,180,0)');
  g.fillStyle = runeGlow; g.fillRect(cx - gateR * 1.4, gateY - gateR * 1.4, gateR * 2.8, gateR * 2.8);
  g.strokeStyle = '#8ad0ff'; g.lineWidth = Math.max(3, 5 * S);
  for (let i = 0; i < 3; i++) g.strokeRect(cx - gateR + i * gateR * 0.23, gateY - gateR + i * gateR * 0.23, gateR * 2 - i * gateR * 0.46, gateR * 2 - i * gateR * 0.46);
  g.fillStyle = '#9db4d0'; g.fillRect(cx - 10 * S, H * 0.76, 20 * S, 38 * S);
  g.fillStyle = '#e9d9ad'; g.fillRect(cx - 7 * S, H * 0.73, 14 * S, 14 * S);
  g.fillStyle = '#c89a36'; g.fillRect(cx + 10 * S, H * 0.78, 26 * S, 4 * S);
  // dark cinematic grade
  const grade = g.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, 'rgba(8,6,20,0.88)');
  grade.addColorStop(0.42, 'rgba(8,6,20,0.35)');
  grade.addColorStop(1, 'rgba(8,6,20,0.72)');
  g.fillStyle = grade; g.fillRect(0, 0, W, H);
  // vignette
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  // torches
  torch(W * 0.12, H * 0.30, S); torch(W * 0.88, H * 0.30, S);
  if (!sq) { torch(W * 0.30, H * 0.18, S * 0.8); torch(W * 0.70, H * 0.18, S * 0.8); }

  // title
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = Math.min((sq ? 118 : 150) * S, W * (sq ? 0.16 : 0.115));
  g.shadowColor = 'rgba(255,180,60,0.85)'; g.shadowBlur = 42 * S;
  const gold = g.createLinearGradient(0, H * 0.16 - fs, 0, H * 0.16 + fs);
  gold.addColorStop(0, '#ffe9a8'); gold.addColorStop(0.5, '#f5c542'); gold.addColorStop(1, '#b07818');
  g.fillStyle = gold;
  g.font = `900 ${fs}px Georgia, 'Times New Roman', serif`;
  if (sq) {
    g.fillText('RUNIC', W / 2, H * 0.13);
    g.fillText('DEPTHS', W / 2, H * 0.13 + fs * 1.04);
  } else {
    g.fillText('RUNIC DEPTHS', W / 2, H * 0.18);
  }
  g.shadowBlur = 0;
  document.title = 'ready';
}
main();
</script>
</body>
</html>
