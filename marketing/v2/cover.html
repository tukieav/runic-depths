<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runic Depths — cover composition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081014}
.cover{position:relative;width:100vw;height:100vh;isolation:isolate;overflow:hidden;background:#091217}
.heroes{position:absolute;inset:0;background:url('../../assets/hero-atlas.png') center 42%/cover no-repeat}
.portrait-heroes{display:none;position:absolute;inset:0}
.hero{height:100%;background-image:url('../../assets/hero-atlas.png');background-repeat:no-repeat;background-size:auto 100%;background-position-y:40%}
.hero:nth-child(1){width:31%;background-position-x:24%}.hero:nth-child(2){width:38%;background-position-x:50%}.hero:nth-child(3){width:31%;background-position-x:76%}
.light{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 30%,#050a1066 100%),linear-gradient(0deg,#04080df2 0%,#070c14b3 13%,transparent 48%);pointer-events:none}
.title{position:absolute;inset:auto 3% 7%;margin:0;text-align:center;font-family:'P052','Palatino Linotype','Book Antiqua',serif;font-weight:700;font-size:clamp(40px,8.8vw,185px);line-height:1.05;letter-spacing:.10em;filter:drop-shadow(0 3px 0 #3d291a) drop-shadow(0 8px 8px #000);white-space:nowrap}
.title span{display:inline-block;padding:.03em .03em .1em;background:linear-gradient(180deg,#fff6cf 8%,#e4c786 34%,#a67e44 55%,#ecd391 61%,#d7ad66 90%);background-clip:text;-webkit-background-clip:text;color:transparent}
.title span+span{margin-left:.18em}
@media(max-aspect-ratio:6/5){.heroes{background-position:50% 30%;background-size:auto 100%}.portrait-heroes{display:flex}.title{bottom:6%;font-size:15vw;letter-spacing:.115em;line-height:.97}.title span{display:block}.title span+span{margin-left:0}.light{background:radial-gradient(ellipse at 50% 31%,transparent 28%,#03090d70 100%),linear-gradient(0deg,#04080dfc 0%,#04080dad 22%,transparent 52%)}}
@media(max-aspect-ratio:3/4){.portrait-heroes{inset:0 -7%}.title{bottom:8%;font-size:17vw;line-height:1.06}.light{background:radial-gradient(ellipse at 50% 31%,transparent 20%,#03090d70 100%),linear-gradient(0deg,#04080dfc 0%,#04080dd9 15%,transparent 50%)}}
</style>
</head>
<body><main class="cover" aria-label="Runic Depths cover"><div class="heroes"></div><div class="portrait-heroes"><div class="hero"></div><div class="hero"></div><div class="hero"></div></div><div class="light"></div><h1 class="title"><span>RUNIC</span><span>DEPTHS</span></h1></main>
<script>const art=new Image();art.onload=()=>{document.fonts.ready.then(()=>{window.coverReady=true})};art.src='../../assets/hero-atlas.png';</script>
</body>
</html>
