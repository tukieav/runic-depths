<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta
      name="description"
      content="Runic Depths: The Hollow Covenant. An original isometric action RPG. Five heroes, six realms, one forgotten truth. English and Polish."
    />
    <title>Runic Depths · The Hollow Covenant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23d6b878' d='M16 1L29 16 16 31 3 16zm0 7L9 16l7 8 7-8z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./bundle.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Isometric action role-playing game"></canvas>
    <div id="loading" role="status">
      <div class="rune-mark">ᛟ</div>
      <h1>RUNIC DEPTHS</h1>
      <p>THE HOLLOW COVENANT</p>
      <div class="loading-line"></div>
    </div>
    <div id="hud" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-rune">ᛟ</span>
          <div><b>RUNIC DEPTHS</b><small id="chapter-label"></small></div>
        </div>
        <div class="top-actions">
          <button id="language-button" class="small-button" aria-label="Change language">EN</button
          ><button id="audio-button" class="small-button" aria-label="Toggle sound">♫</button
          ><button id="pause-button" class="small-button" aria-label="Pause">Ⅱ</button>
        </div>
      </header>
      <aside class="quest-panel">
        <div class="eyebrow" id="quest-eyebrow"></div>
        <h2 id="quest-title"></h2>
        <p id="quest-description"></p>
        <div class="quest-progress"><i id="quest-fill"></i></div>
        <div class="quest-count" id="quest-count"></div>
      </aside>
      <aside class="map-panel">
        <canvas id="minimap" width="164" height="164" aria-label="Explored dungeon map"></canvas
        ><span id="map-caption"></span>
      </aside>
      <div id="boss-hud" hidden>
        <div id="boss-name"></div>
        <div class="boss-track"><i id="boss-fill"></i></div>
        <small id="boss-phase"></small>
      </div>
      <div id="floor-announcement" aria-live="polite"></div>
      <div id="toast-stack" aria-live="polite"></div>
      <div id="interaction-wrap"><button id="interact-button"></button></div>
      <div id="onboarding">
        <b id="onboarding-title"></b><span id="onboarding-text"></span
        ><button id="dismiss-tutorial" aria-label="Dismiss tutorial">×</button>
      </div>
      <div id="damage-flash"></div>
      <div id="combat-text"></div>
      <footer class="bottom-hud">
        <div class="hero-panel">
          <div class="portrait" id="portrait">ᛉ</div>
          <div class="hero-info">
            <div class="hero-heading">
              <strong id="hero-name"></strong><span id="hero-level"></span>
            </div>
            <div class="stat-track health">
              <i id="health-fill"></i><span id="health-value"></span>
            </div>
            <div class="stat-track mana"><i id="mana-fill"></i><span id="mana-value"></span></div>
          </div>
        </div>
        <div class="actionbar">
          <button class="skill-button" id="basic-button">
            <kbd>↵</kbd><span class="skill-symbol">⚔</span><small id="basic-label"></small></button
          ><button class="skill-button" id="skill-0">
            <kbd>1</kbd><span class="skill-symbol">◈</span><small></small><em></em></button
          ><button class="skill-button" id="skill-1">
            <kbd>2</kbd><span class="skill-symbol">✧</span><small></small><em></em></button
          ><button class="skill-button" id="skill-2">
            <kbd>3</kbd><span class="skill-symbol">◎</span><small></small><em></em></button
          ><button class="skill-button" id="dodge-button">
            <kbd>Space</kbd><span class="skill-symbol">➶</span><small id="dodge-label"></small
            ><em></em></button
          ><button class="skill-button potion-button" id="potion-button">
            <kbd>Q</kbd><span class="skill-symbol">♜</span><small id="potion-label"></small
            ><em></em>
          </button>
        </div>
        <div class="utility-panel">
          <span class="gold-display">◆ <b id="gold-value">0</b></span>
          <div>
            <button id="inventory-button" title="Inventory · I">▦</button
            ><button id="journal-button" title="Journal · J">▤</button
            ><button id="talents-button" title="Talents · T">
              ✧<i id="talent-badge" hidden></i></button
            ><button id="character-button" title="Choose hero">♙</button>
          </div>
        </div>
        <div class="xp-track"><i id="xp-fill"></i></div>
      </footer>
      <div id="touch-stick" aria-label="Movement joystick"><i></i></div>
      <div id="save-status"></div>
    </div>
    <div id="modal-root" hidden></div>
    <script src="./bundle.js"></script>
  </body>
</html>
