<script>

  // published builds keeps local/isolated QA deterministic when the CDN is
  // unavailable, while the wrapper continues to use safe no-op fallbacks.

    const sdk = document.createElement('script');
    sdk.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    sdk.async = true;
    document.head.appendChild(sdk);
  }
</script>

</style>
</head>
